<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Travel through time with a guide robot: pick a year from 1948 to today, meet the people, explore the events, and discover how currencies changed. A hands-only WebXR experience." />
    <link rel="icon" href="data:," />
    <title>Currency Time Machine</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #02040a; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #start-overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, rgba(10, 23, 52, 0.92), rgba(2, 4, 9, 0.96));
        color: #f4f6fa; z-index: 10; padding: 16px; box-sizing: border-box;
      }
      #start-overlay.hidden { display: none; }
      .card { max-width: 560px; text-align: center; }
      h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 12px; letter-spacing: 0.5px; }
      p { font-size: 18px; line-height: 1.5; color: #d8deea; margin: 0 0 22px; }
      .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      button {
        font: inherit; font-size: 18px; font-weight: 600; padding: 14px 24px; border-radius: 999px;
        border: 2px solid #ffd84a; cursor: pointer; min-width: 200px;
      }
      #enter-vr { background: #ffd84a; color: #0b0f1a; }
      #watch-browser { background: transparent; color: #ffd84a; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
      .small { font-size: 14px; color: #aab3c5; margin-top: 22px; }
      fieldset { border: 0; margin: 0 0 18px; padding: 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      fieldset label { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid #3a4a6a; cursor: pointer; text-align: left; font-size: 16px; color: #e4e9f3; }
      fieldset label:has(input:checked) { border-color: #ffd84a; background: rgba(255, 216, 74, 0.08); }
      fieldset small { display: block; color: #aab3c5; font-size: 13px; }
      .opts { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: -6px 0 18px; font-size: 15px; color: #d8deea; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="start-overlay" role="dialog" aria-labelledby="title">
      <div class="card">
        <h1 id="title">Currency Time Machine</h1>
        <p>Travel through time. Meet the people, explore the events, and discover how currencies changed. Headphones recommended.</p>
        <fieldset aria-label="Journey">
          <label><input type="radio" name="mode" value="year" checked /> <span>Year Journey<small>Pick a year; a guide robot shows you around (about 2 minutes)</small></span></label>
          <label><input type="radio" name="mode" value="full" /> <span>Full Journey<small>Every year from 1948 to today (about 4 minutes)</small></span></label>
        </fieldset>
        <div class="opts">
          <label><input type="checkbox" id="opt-voice" checked /> Guide voice (subtitles always on)</label>
          <label><input type="checkbox" id="opt-calm" /> Calm motion</label>
        </div>
        <div class="buttons">
          <button id="enter-vr" disabled>Enter VR</button>
          <button id="watch-browser" disabled>Watch in browser</button>
        </div>
        <p class="small" id="start-status">Loading...</p>
        <p class="small">Exchange rate data: Frankfurter (frankfurter.dev)</p>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
